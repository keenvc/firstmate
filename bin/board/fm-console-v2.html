// One SVG per pipeline: every finished build as a mark, a rolling average over the points, and the

function buildChartSVG(p,hours){

 var p98=durs[Math.min(durs.length-1,Math.floor(durs.length*0.98))]||60;

 function X(t){return L+(t-t0)/(t1-t0)*pw}

  var y=Y(v);

   '<text x="'+(L-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#6f6d67" font-size="10" text-anchor="end">'+fmtDur(v)+"</text>";

  xl+='<line x1="'+x.toFixed(1)+'" y1="'+T+'" x2="'+x.toFixed(1)+'" y2="'+(T+ph)+'" stroke="#1f1f1f"/>'+
   '<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" fill="#6f6d67" font-size="10" text-anchor="'+(i===0?"start":i===4?"end":"middle")+'">'+esc(lab)+"</text>";
 }
 function marks(list,color,w){
  if(!list.length)return "";
  return '<path d="'+list.map(function(q){return "M"+X(q[0]).toFixed(1)+","+(Y(q[1])-3).toFixed(1)+"v6"}).join("")+

 if(OS_ERR!=null)el.innerHTML+='<div style="color:#f87171;font-size:12px;padding-top:8px">last read problem: '+esc(String(OS_ERR))+"</div>";
}
function osPhaseFor(d,key){
 var out=null;
 ["adclinica","fdc","v10"].forEach(function(pr){
  var ph=((d.projects||{})[pr]||{}).phases||[];
  ph.forEach(function(x){if(x.key===key&&(!out||x.items>out.items))out=x});
 });
 return out;
}
// ---- Done out of total (captain order 2026-11-15) -------------------------------------------
// The boss read "WhatsApp 5%" and "average 6%" as the project being 6% done. Those numbers are the
// average progress of the work still open, so they only ever rise as issues close. This block is the
// other reading: how many of each Linear phase's issues are Done, out of every issue that was not
// canceled or duplicated. Both are stamped in full so neither can be read as the other - the reader
// needs no hover, and a number without its label is never shown.
var pdSortDone=function(a,b){return (b.done||0)-(a.done||0)||String(a.label||"").localeCompare(String(b.label||""))};
function osDonePhaseLine(label,x,strong){
 if(!x||x.done==null||x.total==null){
  return '<div style="margin-top:6px;font-size:11px;color:var(--muted)">'+esc(label)+': done-out-of-total not read yet</div>';
 }
 var pct=x.pct_done==null?'<span style="color:var(--muted)">–</span>':esc(String(x.pct_done))+"%";
 var sz=strong?"13px":"11.5px", w=strong?150:74;
 return '<div style="margin-top:'+(strong?"8":"6")+'px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap">'+
  (strong?'':'<span style="min-width:9ch;font-size:'+sz+';color:var(--muted)">'+esc(label)+'</span>')+
  '<span style="display:inline-block;width:'+w+'px;height:5px;background:var(--ok);border-radius:3px;overflow:hidden;opacity:.5" aria-hidden="true">'+
   '<span style="display:block;height:100%;width:'+Math.max(0,Math.min(100,x.pct_done||0))+'%;background:var(--ok)"></span></span>'+
  '<b style="font-size:'+sz+';font-variant-numeric:tabular-nums;color:var(--ink)">Done '+esc(String(x.done))+' of '+esc(String(x.total))+' = '+pct+'</b></div>';
}
function osDonePhaseFor(d,key){
 var b=(d||{}).phase_done||{};var ph=b.phases||[];
 for(var i=0;i<ph.length;i++){if(ph[i].key===key)return ph[i]}
 return null;
}
function osDoneNotes(b){
 if(!b)return "";
 var bits=["done = Linear Done · total = every issue in the phase's Linear project minus canceled and duplicate"];
 if(b.at)bits.push("counted "+esc(b.generated_iso||"")+(b.stale?" (kept from an earlier read: "+(b.error||"a source failed")+")":""));
 if(b.cache_sec)bits.push("re-read at most every "+esc(String(Math.round(b.cache_sec/60)))+" min");
 return '<div style="font-size:10.5px;color:#6f6d67;padding:2px 0 0;max-width:96ch">'+bits.join(" · ")+"</div>";
}
function renderProgressTab(){
 var el=document.getElementById("progPane");if(!el)return;
 if(OS_ERR!=null&&!OS_DATA){el.innerHTML='<section class=card><div style="padding:14px;font-size:12.5px;color:#f87171">AdClinica progress could not be read (error '+esc(String(OS_ERR))+").</div></section>";return}
 if(!OS_DATA){el.innerHTML='<section class=card><div style="padding:14px;font-size:12.5px;color:var(--muted)">Reading AdClinica progress…</div></section>';return}
 var d=OS_DATA,a=(d.projects||{}).adclinica||{};
 var rel=a.release||{};
 var cards=OS_PHASES.map(function(ph){
  var x=osPhaseFor(d,ph[0]);
  var pd=osDonePhaseFor(d,ph[0]);
  var doneLine=pd?osDonePhaseLine(ph[1],pd,false):"";
  if(!x)return '<section class=card style="padding:12px 14px"><div style="font-size:12.5px"><b>'+esc(ph[1])+"</b></div><div class=empty>nothing open in this phase</div>"+doneLine+"</section>";
  return '<section class=card style="padding:12px 14px" data-os-ph="'+esc(ph[0])+'" role=button tabindex=0>'+
   '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:12.5px">'+esc(ph[1])+"</b>"+
   '<span style="text-align:right"><span style="font-size:10px;color:var(--muted);display:block;line-height:1.2">open work only</span>'+
   '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:18px">'+esc(String(x.pct))+"%</span></span></div>"+
   '<div style="margin:8px 0"><span style="display:inline-block;width:100%;height:7px;background:var(--idleb);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:'+Math.max(0,Math.min(100,x.pct||0))+'%;background:'+(x.pct>=85?"var(--ok)":x.pct>=25?"var(--run)":"var(--idle)")+'"></span></span></div>'+
   '<div style="font-size:11px;color:var(--muted)">'+esc(String(x.items))+" open"+(x.eta_missing?" · "+esc(String(x.eta_missing))+" without an ETA":"")+"</div>"+
   doneLine+
   '<div style="font-size:10.5px;color:#6f6d67">'+esc(OS_PH_OPEN[ph[0]]?"▾ details":"▸ open details")+"</div></section>"
 }).join("");
 var detailKeys=OS_PHASES.filter(function(p){return OS_PH_OPEN[p[0]]});
 var details=detailKeys.map(function(ph){
  var x=osPhaseFor(d,ph[0]);if(!x)return "";
  var hits=[];
  ["adclinica","fdc","v10"].forEach(function(pr){
   (((d.projects||{})[pr]||{}).items||[]).forEach(function(i){hits.push(i)});
  });
  return '<section class=card style="margin-top:12px"><div class=cardHead><b style="font-size:12.5px">'+esc(ph[1])+" · every open issue behind this percent</b></div>"+
   osItemsTable(osPhaseItems(d,ph[0]))+"</section>"
 }).join("");
 el.innerHTML=osHead()+
  '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding-bottom:12px">'+
   "<span>production serves <b>"+esc((rel.prod||{}).version||"unknown")+"</b> ("+esc((rel.prod||{}).sha||"")+")</span>"+
   "<span>next release <b>"+esc(rel.name||"none open")+"</b> · "+esc(rel.when||"")+"</span>"+
   "<span><b>"+esc(String((a.totals||{}).open||0))+"</b> open ADC issues</span></div>"+
  osDoneBlock(d)+
  '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:16px 0 6px">'+
   '<b style="font-size:12.5px">Open work only</b>'+
   '<span style="color:var(--muted);font-size:11.5px">average progress of what is still open — not how much of the project is built · '+
    'percent: 0 Todo · 25 claimed · 50 PR open · 75 PR green · 85 merged to dev · 100 in prod</span></div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">'+cards+"</div>"+
  details+
  '<section style="margin-top:14px">'+osAdhocTable(((d.adhoc||{}).by_project||{}).adclinica||[])+"</section>"
}
function osDoneBlock(d){
 var b=(d||{}).phase_done;
 if(!b)return '<section class=card style="padding:12px 14px"><b style="font-size:12.5px">Done out of total</b>'+
  '<div class="empty" style="margin:4px 0 0">not read yet — the collector writes this on its own cache</div></section>';
 var pr=b.phases||[];
 var adc=b.adc||{};
 var head='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:baseline">'+
  '<b style="font-size:13.5px">Done out of total</b>'+
  '<span style="color:var(--muted);font-size:11.5px">how much of AdClinica is built, phase by phase — the finished work, not the open queue</span></div>';
 var top=adc.done==null?'<span style="color:var(--muted)">not read yet</span>':
  '<b style="font-variant-numeric:tabular-nums;font-size:15px">Done '+esc(String(adc.done))+' of '+esc(String(adc.total))+' = '+
   esc(String(adc.pct_done==null?"–":adc.pct_done))+'%</b>';
 var sum='<div style="margin-top:4px;font-size:12px">AdClinica total · '+top+
  '<span style="color:var(--muted)"> · '+esc(String(adc.canceled==null?"–":adc.canceled))+' canceled and '+
   esc(String(adc.duplicate==null?"–":adc.duplicate))+' duplicate left out of the total</span></div>';
 var cards=pr.slice().sort(pdSortDone).map(function(x){
  return '<section class=card style="padding:10px 12px">'+
   '<div style="font-size:12px;font-weight:600">'+esc(x.label)+"</div>"+
   osDonePhaseLine(x.label,x,true)+"</section>"}).join("");
 var missing=pr.length?"":'<div class="empty">No phase was counted, so no done-out-of-total number is shown.</div>';
 return '<section style="margin-top:6px"><div class=card style="padding:12px 14px">'+head+sum+osDoneNotes(b)+"</div>"+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px">'+cards+"</div>"+
  missing+"</section>"
}
function osPhaseItems(d,key){
 var rx={whatsapp:/whatsapp|\bwa[- ]/i,"create-video":/create video|\bclip\b|storyboard|\bvideo\b/i,
  "dashboard-flips":/APP_SHELL_V2|CLINIC_ACCOUNT_MENU|REVIEWS_ENABLED|CREATE_CHAT_ENABLED|switch|flip|dashboard/i,
  "snapshot-ads":/snapshot|ads|competitor|google business|\bgbp\b|linkedin|instagram|analytics|posts?\b/i,
  "fdc-booking":/booking|\/book/i}[key];
 if(!rx)return [];
 var out=[];
 ["adclinica","fdc","v10"].forEach(function(pr){
  (((d.projects||{})[pr]||{}).items||[]).forEach(function(i){if(rx.test((i.project||"")+" "+i.title))out.push(i)});
 });
 (((d.adhoc||{}).by_project||{}).adclinica||[]).forEach(function(i){if(rx.test(i.title))out.push({id:i.id,title:i.title,url:i.url,state:i.state,owner:i.owner,pr:null,deployed:"—",pct:i.pct,pct_basis:i.pct_basis,eta:i.eta,eta_reason:i.eta_reason})});
 return out.sort(function(a,b){return a.pct-b.pct})
}
function loadOutstanding(){
 pollJSON("/api/console/outstanding.json",function(d){OS_DATA=d;OS_ERR=null;
   if(st.tab==="outstanding")renderOutstandingTab();
   if(st.tab==="progress")renderProgressTab();
   if(st.tab==="growth")renderGrowthTab()},
  function(c){OS_ERR=c;
   if(st.tab==="outstanding")renderOutstandingTab();
   if(st.tab==="progress")renderProgressTab();
   if(st.tab==="growth")renderGrowthTab()},20000)
}
document.addEventListener("click",function(e){
 var v=e.target.closest?e.target.closest("[data-os-view]"):null;
 if(v){e.preventDefault();st.osView=v.getAttribute("data-os-view");save();renderOutstandingTab();return}
 var a=e.target.closest?e.target.closest("[data-os-all]"):null;
 if(a){e.preventDefault();OS_SHOW_ALL=true;renderOutstandingTab();return}
 var p=e.target.closest?e.target.closest("[data-os-ph]"):null;
 if(p){var k=p.getAttribute("data-os-ph");OS_PH_OPEN[k]=!OS_PH_OPEN[k];renderProgressTab();return}
 // Get update (captain order 2026-11-15, ADC-1234): the button is disabled while a request is open,
 // and the server re-checks the window anyway. A refusal (429) is shown on the row with the state
 // the server returned, so a stale page corrects itself instead of silently doing nothing.
 var u=e.target.closest?e.target.closest("[data-upd]"):null;
 if(u){
  e.preventDefault();
  var ukey=u.getAttribute("data-upd");
  if(UPD_BUSY[ukey]||u.disabled)return;
  UPD_BUSY[ukey]=1;if(st.tab==="outstanding")renderOutstandingTab();
  post("/api/console/update-request",{key:ukey},function(code,txt){
   var r={};try{r=JSON.parse(txt||"{}")}catch(_){}
   delete UPD_BUSY[ukey];
   if(r.state&&typeof r.state==="object"){
    UPD_NOTE[ukey]=r.state;
   }else if(code===200){
    // the note is saved; ask once more so the row shows the real "requested" stamp
    pollJSON("/api/console/update-request?keys="+encodeURIComponent(ukey),function(d){
     if(d&&d.rows&&d.rows[ukey])UPD_NOTE[ukey]=d.rows[ukey];if(st.tab==="outstanding")renderOutstandingTab()},
     function(){if(st.tab==="outstanding")renderOutstandingTab()},12000);
   }else{
    var keep=UPD_NOTE[ukey]||updFor(ukey);
    // 403 is the console's own refusal: either no Cloudflare Access login reached it, or this login
    // may only send the TEST identity. Say which, because the fix differs.
    var why=code===403?'not signed in to the board (reload the page and sign in)':
            code===429?"one request per task per 5 minutes":(code?("could not send ("+code+")"):"the board did not answer");
    if(r.error&&code!==403)why+=" · "+r.error;
    UPD_NOTE[ukey]={requested_error:why,receipts_error:keep.receipts_error,answered_at:keep.answered_at,reply:keep.reply,
     requested_at:keep.requested_at,open:keep.open,elapsed_sec:keep.elapsed_sec,retry_at:keep.retry_at};
   }
   if(st.tab==="outstanding")renderOutstandingTab();
   // the collector joins the reply, so refresh shortly after a send and once more on the window edge
   setTimeout(loadOutstanding,5000);
  });
  return;
 }
},true);

renderNav();go(st.tab);loadQ();qpane();refreshAll();dload();loadLanes();loadCalls();loadCopper();loadSA();loadPph();loadPhases();loadTasks();loadOutstanding();
// The zone label is stated once, in the header, so a reader never has to infer it per timestamp.
(function(){var e=document.getElementById("tzName");if(e)e.textContent=TZ_NAME||"your local time"})();
// Nick's questions refreshes on its own slower cadence: the collector re-reads transcripts
// only when one changed, so this is a local file read, but 30s is enough for a question log.
setInterval(function(){if(st.tab==="nicks")nickLoad()},30000);
setInterval(tick,1000);setInterval(loadQ,Q_MS);setInterval(speedLoad,15000);setInterval(function(){if(st.tab==="decisions")dload()},Q_MS);
// The 15s live cadence: lanes always, calls always (both are ~60ms local reads).
setInterval(function(){loadLanes();loadCalls();loadCopper();loadSA()},LANE_MS);
// The merge sweep is a file written once a minute, so the page re-reads it once a minute too.
setInterval(function(){loadPph()},60000);
// Phase progress rides the same 60s cadence as every other feed (captain ask 2026-11-10).
setInterval(function(){loadPhases()},PH_MS);
setInterval(function(){loadFlights()},FL_MS);
setInterval(function(){if(st.tab==="flights"&&FL_MODE==="tracker")loadAtc()},ATC_MS);
// Task progress is a file written once a minute by fm-ananda-tasks.timer (captain ask M365).
setInterval(loadTasks,60000);
// Outstanding + AdClinica Progress ride the same 60s cadence (captain order 2026-11-15).
setInterval(loadOutstanding,OS_MS);})();
</script></body></html>
